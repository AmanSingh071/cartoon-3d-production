name: Blender Production Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge/scripts/**'
      - '.github/workflows/blender-build.yml'

jobs:
  blender-build:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 720
    steps:
      - name: Sync local Blender project
        shell: cmd
        run: |
          cd /d "D:\first Blender"
          git config --global --add safe.directory "D:\first Blender"
          git pull --ff-only origin main
      - name: Verify Blender
        shell: cmd
        run: |
          if not exist "D:\blender.exe" exit /b 1
          "D:\blender.exe" --version
      - name: Run full 10 minute production
        shell: cmd
        run: |
          if not exist "D:\first Blender\first blender.blend" exit /b 1
          if not exist "D:\first Blender\bridge\scripts\build_production.py" exit /b 1
          "D:\blender.exe" "D:\first Blender\first blender.blend" --background --python "D:\first Blender\bridge\scripts\build_production.py"
      - name: Verify final movie
        shell: cmd
        run: |
          if not exist "D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.mp4" exit /b 1
          dir "D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.mp4"
          if not exist "D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.blend" exit /b 1
      - name: Upload final production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Milo-and-the-Moonflower-FINAL
          path: |
            D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.mp4
            D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.blend
            D:\first Blender\bridge\audio\*.wav
            D:\first Blender\bridge\logs\*.log
          if-no-files-found: warn
          retention-days: 30
