name: Blender Production Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge/scripts/**'
      - '.github/workflows/blender-build.yml'

concurrency:
  group: blender-production
  cancel-in-progress: true

jobs:
  blender-build:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 720
    steps:
      - name: Sync local Blender project
        shell: cmd
        run: |
          cd /d "D:\first Blender"
          git config --global --add safe.directory "D:\first Blender"
          git fetch origin main
          git reset --hard origin/main
      - name: Verify Blender
        shell: cmd
        run: |
          if not exist "D:\blender.exe" exit /b 1
          "D:\blender.exe" --version
      - name: Install neural TTS dependencies
        shell: cmd
        run: |
          if not exist "D:\first Blender\bridge\python_packages" mkdir "D:\first Blender\bridge\python_packages"
          "D:\blender.exe" --background --python-expr "import ensurepip; ensurepip.bootstrap()"
          "D:\blender.exe" --background --python-expr "import subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--disable-pip-version-check','--upgrade','--target',r'D:\first Blender\bridge\python_packages','edge-tts','imageio-ffmpeg'])"
      - name: Apply quality production overrides
        shell: cmd
        run: |
          if not exist "D:\first Blender\bridge\scripts\production_overrides.py" exit /b 1
          "D:\blender.exe" --background --python "D:\first Blender\bridge\scripts\production_overrides.py"
      - name: Patch Blender 5.2 production settings
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$p='D:\first Blender\bridge\scripts\build_production.py'; $t=Get-Content -Raw -LiteralPath $p; $t=$t.Replace('BLENDER_EEVEE_NEXT','BLENDER_EEVEE'); $t=$t.Replace(\"scene.render.image_settings.file_format='FFMPEG'\",\"scene.render.image_settings.media_type='VIDEO'; scene.render.image_settings.file_format='FFMPEG'\"); $t=$t.Replace(\"master.render.image_settings.file_format='FFMPEG'\",\"master.render.image_settings.media_type='VIDEO'; master.render.image_settings.file_format='FFMPEG'\"); Set-Content -LiteralPath $p -Value $t -Encoding UTF8"
      - name: Validate production script syntax
        shell: cmd
        run: |
          "D:\blender.exe" --background --python-expr "import ast; p=r'D:\first Blender\bridge\scripts\build_production.py'; ast.parse(open(p,encoding='utf-8').read()); print('PRODUCTION SCRIPT SYNTAX OK')"
      - name: Run full 10 minute production
        shell: cmd
        run: |
          echo Automatic production retry after previous verification failure.
          if not exist "D:\first Blender\first blender.blend" exit /b 1
          if not exist "D:\first Blender\bridge\scripts\build_production.py" exit /b 1
          "D:\blender.exe" "D:\first Blender\first blender.blend" --background --python "D:\first Blender\bridge\scripts\build_production.py"
      - name: Verify final movie
        shell: cmd
        run: |
          if not exist "D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.mp4" exit /b 1
          for %%F in ("D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.mp4") do if %%~zF LSS 100000 exit /b 1
          dir "D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.mp4"
          if not exist "D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.blend" exit /b 1
          for %%F in ("D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.blend") do if %%~zF LSS 100000 exit /b 1
      - name: Upload final production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Milo-and-the-Moonflower-FINAL
          path: |
            D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.mp4
            D:\first Blender\bridge\output\Milo_and_the_Moonflower_FINAL.blend
            D:\first Blender\bridge\audio\*.wav
            D:\first Blender\bridge\audio\*.mp3
            D:\first Blender\bridge\logs\*.log
          if-no-files-found: warn
          retention-days: 30
