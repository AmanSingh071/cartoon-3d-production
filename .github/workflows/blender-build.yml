name: Blender Production Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge/scripts/**'
      - '.github/workflows/blender-build.yml'

jobs:
  blender-build:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 30
    steps:
      - name: Sync local Blender project
        shell: cmd
        run: |
          cd /d "D:\first Blender"
          git config --global --add safe.directory "D:\first Blender"
          git pull --ff-only origin main
      - name: Verify Blender
        shell: cmd
        run: |
          if not exist "D:\blender.exe" exit /b 1
          "D:\blender.exe" --version
      - name: Run hero quality build
        shell: cmd
        run: |
          if not exist "D:\first Blender\first blender.blend" exit /b 1
          if not exist "D:\first Blender\bridge\scripts\build_hero.py" exit /b 1
          "D:\blender.exe" "D:\first Blender\first blender.blend" --background --python "D:\first Blender\bridge\scripts\build_hero.py"
      - name: Verify hero preview
        shell: cmd
        run: |
          if not exist "D:\first Blender\bridge\output\hero_quality.png" exit /b 1
          dir "D:\first Blender\bridge\output\hero_quality.png"
      - name: Upload hero preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-quality-preview
          path: |
            D:\first Blender\bridge\output\hero_quality.png
            D:\first Blender\bridge\output\hero_quality.blend
            D:\first Blender\bridge\logs\*.log
          if-no-files-found: warn
          retention-days: 7
