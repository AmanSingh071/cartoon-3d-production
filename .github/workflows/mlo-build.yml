name: MLO Build

on:
  push:
    branches: [mlo-production]
    paths:
      - 'mlo/**'
      - '.github/workflows/mlo-build.yml'
  workflow_dispatch:

jobs:
  build-mlo:
    # Dedicated Windows Blender runner. Use only the built-in self-hosted label.
    runs-on: [self-hosted]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout MLO branch
        uses: actions/checkout@v4
        with:
          ref: mlo-production
          fetch-depth: 1

      - name: Sync production files to Blender workspace
        run: |
          @echo off
          set "SRC=%GITHUB_WORKSPACE%\mlo"
          set "ROOT=D:\first Blender\mlo"
          if not exist "%SRC%\scripts\build_mlo.py" exit /b 1
          if not exist "%SRC%\build_mlo.cmd" exit /b 1
          if not exist "%ROOT%" mkdir "%ROOT%"
          robocopy "%SRC%" "%ROOT%" /E /PURGE /R:2 /W:1 /NFL /NDL /NP
          if errorlevel 8 exit /b %errorlevel%
          if not exist "%ROOT%\scripts\build_mlo.py" exit /b 1
          if not exist "%ROOT%\build_mlo.cmd" exit /b 1

      - name: Verify Blender
        run: |
          @echo off
          if not exist "D:\blender.exe" (
            echo Blender not found at D:\blender.exe
            exit /b 1
          )
          "D:\blender.exe" --version
          if errorlevel 1 exit /b 1

      - name: Clean previous MLO outputs
        run: |
          @echo off
          set "OUT=D:\first Blender\mlo\output"
          if not exist "%OUT%" mkdir "%OUT%"
          del /F /Q "%OUT%\Nocturne_Lounge_MLO.blend" 2>nul
          del /F /Q "%OUT%\mlo_showcase.png" 2>nul
          del /F /Q "%OUT%\mlo_manifest.json" 2>nul

      - name: Build MLO
        run: call "D:\first Blender\mlo\build_mlo.cmd"

      - name: Validate actual MLO geometry
        run: |
          @echo off
          "D:\blender.exe" --background --python "D:\first Blender\mlo\scripts\validate_mlo.py"
          if errorlevel 1 exit /b 1

      - name: Validate outputs
        run: |
          @echo off
          set "OUT=D:\first Blender\mlo\output"
          if not exist "%OUT%\Nocturne_Lounge_MLO.blend" exit /b 1
          if not exist "%OUT%\mlo_showcase.png" exit /b 1
          if not exist "%OUT%\mlo_manifest.json" exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$m=Get-Content -Raw '%OUT%\mlo_manifest.json' | ConvertFrom-Json; if($m.validation.status -ne 'PASS'){exit 1}; if([int]$m.validation.mesh_objects -lt 40){exit 1}; Write-Host 'Manifest validation: PASS'; Write-Host ('Mesh objects: ' + $m.validation.mesh_objects)"
          if errorlevel 1 exit /b 1
          dir "%OUT%\Nocturne_Lounge_MLO.blend" "%OUT%\mlo_showcase.png" "%OUT%\mlo_manifest.json"

      - name: Upload MLO checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Lounge-MLO-${{ github.sha }}
          path: |
            D:\first Blender\mlo\output\Nocturne_Lounge_MLO.blend
            D:\first Blender\mlo\output\mlo_showcase.png
            D:\first Blender\mlo\output\mlo_manifest.json
          if-no-files-found: error
          retention-days: 14
